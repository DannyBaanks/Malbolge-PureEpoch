 <path d="M 678 266 C 700 242, 701 220, 678 196" fill="none" stroke="#5cb8f8" stroke-width="2" stroke-dasharray="4 7"/>
 <circle cx="676" cy="195" r="12" fill="#0b1b27" stroke="#41e4d0" stroke-width="4"/>
 <circle cx="946" cy="194" r="12" fill="#0b1b27" stroke="#f4c468" stroke-width="4"/>
 <circle cx="1044" cy="306" r="12" fill="#0b1b27" stroke="#d986f3" stroke-width="4"/>
 <circle cx="677" cy="266" r="7" fill="#9ed4ff"/>
 <g font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#e7eef5" font-weight="700">
  <text x="648" y="167">E1</text>
  <text x="934" y="164">E2</text>
  <text x="1056" y="333">E3</text>
  <text x="707" y="276" font-size="12" fill="#9cc5e5">RESTORE / RETRY</text>
 </g>
 <circle cx="885" cy="257" r="67" fill="#0b2131" stroke="#4c83a0" stroke-width="1.5"/>
 <circle cx="885" cy="257" r="55" fill="url(#dots)" stroke="#273e52" />
 <text x="885" y="246" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="29" font-weight="800" fill="#dff8ff">0..93</text>
 <text x="885" y="273" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8eb9ca">SHARED CORE</text>
 <path d="M 744 82 H 1115" stroke="#465e76" stroke-opacity=".5"/>
 <text x="744" y="69" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#6da5b4" letter-spacing="1.5">ONE VM PROCESS · REARMED IN PLACE</text>
</g>
</svg>